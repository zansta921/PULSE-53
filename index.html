<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PULSE-53 — Biologie & Espace</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="scroll-container">
    <!-- Section 0 : Hero, molécule + ADN animé + fond spatial -->
    <section class="section hero-section" data-bg="hero">
      <canvas id="bgSpaceHero"></canvas>
      <div id="webgl-hero"></div>
      <div class="vapor-layer"></div>
      <div class="virus-layer"></div>
    </section>

    <!-- Section 1 : Eléphant + ADN -->
    <section class="section animal-section" data-bg="elephant">
      <canvas id="bgSpaceElephant"></canvas>
      <div class="adn-animal" id="adn-elephant"></div>
      <div class="animal-svg" id="elephant-svg"></div>
      <div class="vapor-layer"></div>
      <div class="virus-layer"></div>
    </section>

    <!-- Section 2 : Tortue + ADN -->
    <section class="section animal-section" data-bg="turtle">
      <canvas id="bgSpaceTurtle"></canvas>
      <div class="adn-animal" id="adn-turtle"></div>
      <div class="animal-svg" id="turtle-svg"></div>
      <div class="vapor-layer"></div>
      <div class="virus-layer"></div>
    </section>

    <!-- Section 3 : Axolotl + ADN -->
    <section class="section animal-section" data-bg="axolotl">
      <canvas id="bgSpaceAxolotl"></canvas>
      <div class="adn-animal" id="adn-axolotl"></div>
      <div class="animal-svg" id="axolotl-svg"></div>
      <div class="vapor-layer"></div>
      <div class="virus-layer"></div>
    </section>

    <!-- À propos -->
    <section class="section about-section" data-bg="about">
      <div class="card about">
        <p>PULSE-53, biologie moléculaire et régénération dans l’espace.</p>
        <p>Par Bryan Maison</p>
      </div>
    </section>

    <!-- Contact & Footer -->
    <section class="section contact-section" data-bg="contact">
      <div class="card contact">
        <p>Email : <a href="mailto:maisonbryan92@gmail.com">maisonbryan92@gmail.com</a></p>
        <p>© Bryan Maison - projet biologie moléculaire spatiale</p>
      </div>
    </section>
  </main>
  <!-- Three.js / GSAP for webgl/scroll -->
  <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
