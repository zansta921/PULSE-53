<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PULSE-53 — Ultra 3D Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Loader -->
  <div id="launch-screen">
    <canvas id="virus-animation"></canvas>
    <div class="loader">PULSE-53</div>
  </div>
  <!-- Étoiles -->
  <canvas id="starfield"></canvas>
  <!-- Section WebGL premium -->
  <div id="webgl-container">
    <canvas id="renderCanvas"></canvas>
  </div>
  <!-- Overlay UI -->
  <header id="topbar"><img id="logo-img" src="pulse53.png" alt="Logo PULSE-53" /></header>
  <div id="overlay" class="parallax-layer" data-speed="0.22">
    <h1 id="title">PULSE-53</h1>
    <p id="subtitle">Une exploration ultra 3D du p53 — pulsations, relief, halo, ADN vivant.</p>
  </div>
  <img src="silhouette.png" id="silhouette" alt="biologiste regardant le ciel" class="parallax-layer" data-speed="0.6" />
  <button id="goSlider">En savoir plus ↑</button>
  <!-- ... (suite du slider, cards, footer, comme avant si besoin) ... -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/materials/babylonjs.materials.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
