<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PULSE-53 — Biologie Moléculaire & Espace</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="scroll-container">
    <!-- Section 0 : Hero, molécule + ADN animé + fond spatial -->
    <section class="section hero-section" id="section-hero">
      <canvas id="canvas-hero-bg"></canvas>
      <canvas id="canvas-hero-adn"></canvas>
      <div class="vapor-layer"></div>
      <div class="virus-layer"></div>
    </section>
    <!-- Section Eléphant -->
    <section class="section animal-section elephant-bg" id="section-elephant">
      <canvas class="canvas-bg-animal" id="canvas-elephant-bg"></canvas>
      <div class="animal-svg" id="elephant-svg"></div>
      <canvas class="canvas-adn-animal" id="canvas-elephant-adn"></canvas>
      <div class="vapor-layer"></div>
      <div class="virus-layer"></div>
    </section>
    <!-- Section Tortue -->
    <section class="section animal-section turtle-bg" id="section-turtle">
      <canvas class="canvas-bg-animal" id="canvas-turtle-bg"></canvas>
      <div class="animal-svg" id="turtle-svg"></div>
      <canvas class="canvas-adn-animal" id="canvas-turtle-adn"></canvas>
      <div class="vapor-layer"></div>
      <div class="virus-layer"></div>
    </section>
    <!-- Section Axolotl -->
    <section class="section animal-section axolotl-bg" id="section-axolotl">
      <canvas class="canvas-bg-animal" id="canvas-axolotl-bg"></canvas>
      <div class="animal-svg" id="axolotl-svg"></div>
      <canvas class="canvas-adn-animal" id="canvas-axolotl-adn"></canvas>
      <div class="vapor-layer"></div>
      <div class="virus-layer"></div>
    </section>
    <!-- À propos -->
    <section class="section about-section" id="section-about">
      <div class="card about">
        <p>PULSE-53, biologie moléculaire et régénération dans l’espace.</p>
        <p>Par Bryan Maison</p>
      </div>
    </section>
    <!-- Contact & Footer -->
    <section class="section contact-section" id="section-contact">
      <div class="card contact">
        <p>Email : <a href="mailto:maisonbryan92@gmail.com">maisonbryan92@gmail.com</a></p>
        <p>© Bryan Maison - projet biologie moléculaire spatiale</p>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
